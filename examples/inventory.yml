#
# The emulated switches, for playbooks using glitchwrks.fastiron. The login
# account picks the switch; host names match the hostnames in states/. cs2, an
# ICX 6610, has its own port, for the gate that emulates its SSH server.
fastiron:
  hosts:
    cs1a.example.net:
      ansible_user: cs1a
    cs1b.example.net:
      ansible_user: cs1b
    cs2.example.net:
      ansible_user: cs2
      ansible_port: 2223
  vars:
    ansible_host: 127.0.0.1
    ansible_port: 2222
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: glitchwrks.fastiron.fastiron
    ansible_network_cli_ssh_type: libssh
    ansible_libssh_key_exchange_algorithms: +diffie-hellman-group1-sha1
    ansible_libssh_hostkeys: +ssh-rsa
    ansible_libssh_publickey_algorithms: +ssh-rsa
    ansible_private_key_file: /var/lib/fastiron-emulator/client_rsa
    ansible_host_key_checking: false
    ansible_become: true
    ansible_become_method: ansible.netcommon.enable
    # The enable password in states/; not a real one.
    ansible_become_password: EnPass9

# The MCT pair, for group_vars such as fastiron_group.
fastiron_alb:
  hosts:
    cs1a.example.net:
    cs1b.example.net:
